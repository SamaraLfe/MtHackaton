services:
  ml:
    build: .
    command: python -m uvicorn ml.service:app --host 0.0.0.0 --port 8001
    volumes:
      - ./artifacts:/app/artifacts:ro
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: .
    command: python scripts/start_backend.py
    environment:
      ML_URL: http://ml:8001
      NDTP_PORT: "9201"
      START_MODE: live
    volumes:
      - ./dataset:/app/dataset:ro
      - ./artifacts:/app/artifacts:ro
      - ./state:/app/state
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:9201:9201"
    depends_on:
      ml:
        condition: service_healthy
  dashboard:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
  emulator:
    build: .
    command: python -m emulator.service
    environment:
      NDTP_HOST: backend
      NDTP_PORT: "9201"
      DATA_DIR: dataset
      EMULATOR_INTERVAL_S: "3"
      EMULATOR_MAX_VEHICLES: "0"
    volumes:
      - ./dataset:/app/dataset:ro
    depends_on:
      - backend
